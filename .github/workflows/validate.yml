name: Validate task workflow

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect agent branch
        id: actor
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"

          echo "Branch: $BRANCH"

          if [[ "$BRANCH" =~ ^codex/ ]]; then
            echo "is_agent=true" >> "$GITHUB_OUTPUT"
            echo "agent=codex" >> "$GITHUB_OUTPUT"
            echo "Codex branch detected."

          elif [[ "$BRANCH" =~ ^claude/ ]]; then
            echo "is_agent=true" >> "$GITHUB_OUTPUT"
            echo "agent=claude" >> "$GITHUB_OUTPUT"
            echo "Claude branch detected."

          elif [[ "$BRANCH" =~ ^cursor/ ]]; then
            echo "is_agent=true" >> "$GITHUB_OUTPUT"
            echo "agent=cursor" >> "$GITHUB_OUTPUT"
            echo "Cursor branch detected."

          else
            echo "is_agent=false" >> "$GITHUB_OUTPUT"
            echo "agent=human" >> "$GITHUB_OUTPUT"
            echo "Human/non-agent branch detected."
          fi

      - name: Validate agent branch prefix
        if: steps.actor.outputs.is_agent == 'true'
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"

          if [[ ! "$BRANCH" =~ ^(codex|claude|cursor)/.+$ ]]; then
            echo "Invalid agent branch."
            echo
            echo "Expected one of:"
            echo "  codex/..."
            echo "  claude/..."
            echo "  cursor/..."
            exit 1
          fi

          echo "Valid agent branch prefix."

      - name: Extract task ID from PR
        if: steps.actor.outputs.is_agent == 'true'
        id: task
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          CONTENT="$PR_TITLE
          $PR_BODY"

          TASK_ID=$(echo "$CONTENT" | grep -oE 'CA-[0-9]+' | head -1)

          if [[ -z "$TASK_ID" ]]; then
            echo "Could not find Task ID in pull request."
            echo
            echo "Expected Task ID format:"
            echo "  CA-001"
            echo
            echo "Add the Task ID to the PR title or body."
            exit 1
          fi

          echo "Task ID: $TASK_ID"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Validate agent log exists
        if: steps.actor.outputs.is_agent == 'true'
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
        run: |
          LOG_FILE="agent-logs/${TASK_ID}.md"

          echo "Expected log: $LOG_FILE"

          if [[ ! -f "$LOG_FILE" ]]; then
            echo "Missing task log: $LOG_FILE"
            exit 1
          fi

      - name: Validate required log sections
        if: steps.actor.outputs.is_agent == 'true'
        shell: bash
        env:
          TASK_ID: ${{ steps.task.outputs.task_id }}
        run: |
          LOG_FILE="agent-logs/${TASK_ID}.md"

          REQUIRED_SECTIONS=(
            "## Summary"
            "## Actions"
            "## Decisions"
            "## Problems encountered"
            "## Assumptions"
            "## Validation"
            "## Unfinished work"
            "## Recommended follow-up"
          )

          for SECTION in "${REQUIRED_SECTIONS[@]}"; do
            if ! grep -Fq "$SECTION" "$LOG_FILE"; then
              echo "Missing section in $LOG_FILE:"
              echo "$SECTION"
              exit 1
            fi
          done

          echo "Agent workflow validation passed."

      - name: Human branch validation
        if: steps.actor.outputs.is_agent == 'false'
        shell: bash
        run: |
          echo "Non-agent branch detected."
          echo "Agent-specific validation skipped."